<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">

  <title>LIKED PRODUCTS - Bestify</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>

    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-outfit { font-family: 'Outfit', sans-serif; }

    /* Same card shell as the cart page */
    .order-card {
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      padding-top: 16px;
      padding-bottom: 16px;
    }

    .btn-pay-now-list {
      background-color: #F2A93B; color: #14213D !important;
      font-weight: 700;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
    }

    .btn-buy-now {
      background-color: #F2A93B;
      color: #14213D !important;
      font-weight: 700;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
    }

    .btn-remove-like { color: #ef4444; font-size: 11px; font-weight: 700; }

    .btn-move-cart {
      background-color: #2F7A4F;
      color: #ffffff !important;
      font-weight: 700;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
    }

    .remove-btn { color: #ef4444; font-size: 11px; font-weight: 700; }

  </style>

  <link rel="stylesheet" href="bottom-nav.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body class="antialiased pb-24 bf-has-nav">

  <main class="max-w-md mx-auto px-4 pt-4">

    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <a href="home.html" class="text-slate-500"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-lg font-extrabold text-slate-800 tracking-wider uppercase">LIKED PRODUCTS</h1>
      </div>
      <div class="text-amber-700 font-extrabold text-sm">
        <i class="fa-solid fa-thumbs-up"></i>
      </div>
    </div>

    <div class="text-xs font-bold text-slate-500 mb-4">
      <span id="liked-count">0</span> liked · <span id="item-count" hidden></span>
    </div>

    <div id="loading-state" class="text-center py-12 text-slate-400 text-sm">Loading your liked products…</div>

    <div id="wishlistItems" class="space-y-4 hidden"></div>

    <div id="empty-liked" class="hidden text-center py-12">
      <div class="text-slate-300 text-5xl mb-4"><i class="fa-regular fa-thumbs-up"></i></div>
      <h2 class="text-base font-extrabold text-slate-700">Nothing Liked Yet</h2>
      <p class="text-xs text-slate-400 mt-1">Tap the heart on any product to save it here.</p>
      <a href="home.html" class="inline-block mt-5 px-5 py-2.5 rounded-xl bg-amber-400 text-slate-900 text-xs font-bold">Browse Products</a>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item" id="nav-home">
      <i class="fa-solid fa-store"></i>
      <span>Home</span>
    </a>
    <a href="wishlist.html" class="nav-item" id="nav-liked">
      <i class="fa-regular fa-thumbs-up"></i>
      <span>Liked</span>
    </a>
    <a href="orders.html" class="nav-item" id="nav-orders">
      <i class="fa-solid fa-box"></i>
      <span>Orders</span>
    </a>
    <a href="profile.html" class="nav-item" id="nav-account">
      <i class="fa-regular fa-file-lines"></i>
      <span>My Account</span>
    </a>
  </nav>

  <script type="module" src="wishlist.js"></script>
  <script type="module" src="profile-menu.js"></script>
  <script src="bottom-nav.js"></script>

</body>
</html>
